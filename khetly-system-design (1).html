<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khetly System Design</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--text:#1b2230;--muted:#5d6878;--line:#d9dee6;--accent:#16a34a;--bad:#dc2626;--warn:#d97706;--ok:#16a34a;--shadow:0 8px 30px rgba(15,23,42,.14);--code:#eef1f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--panel:#161d26;--panel2:#1d2631;--text:#e7ecf3;--muted:#9aa7b8;--line:#2a3544;--shadow:0 8px 30px rgba(0,0,0,.5);--code:#0f151c}}
:root[data-theme="dark"]{--bg:#0e1319;--panel:#161d26;--panel2:#1d2631;--text:#e7ecf3;--muted:#9aa7b8;--line:#2a3544;--shadow:0 8px 30px rgba(0,0,0,.5);--code:#0f151c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.search{flex:1;min-width:180px;max-width:420px;position:relative}
.search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text)}
.results{position:absolute;top:36px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:360px;overflow:auto;display:none;z-index:50}
.results div{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
.results div:hover{background:var(--panel2)}
.results small{color:var(--muted);margin-left:6px}
.svcs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.svcs .lbl{font-size:12px;color:var(--muted)}
.svc{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:3px 9px;border-radius:99px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.svc i{width:8px;height:8px;border-radius:50%;display:inline-block}
.svc.on{background:var(--panel2);outline:2px solid currentColor}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:8px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 12px;border-top:1px solid var(--line)}
nav button{border:0;background:none;padding:9px 13px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1240px;margin:0 auto;padding:18px 16px 80px}
section.tab{display:none}section.tab.on{display:block}
h2{margin:6px 0 4px;font-size:20px}h3{margin:20px 0 8px;font-size:15px}
.sub{color:var(--muted);margin:0 0 14px;max-width:80ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.banner{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--panel));border-radius:10px;padding:10px 14px;margin-bottom:14px}
.banner a{color:var(--bad);font-weight:600;cursor:pointer;text-decoration:underline}
.xref{cursor:pointer;color:#2563eb;text-decoration:none;border-bottom:1px dotted currentColor}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .xref{color:#7fb0ff}}
:root[data-theme="dark"] .xref{color:#7fb0ff}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;margin:2px 3px 2px 0;background:var(--panel2)}
.chip.xref{border-bottom:1px solid var(--line)}
.badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px}
.m-GET{background:#dcfce7;color:#166534}.m-POST{background:#dbeafe;color:#1e40af}.m-PATCH{background:#fef3c7;color:#92400e}.m-DELETE{background:#fee2e2;color:#991b1b}
.b-patch{background:#ede9fe;color:#5b21b6}.b-gap{background:#fee2e2;color:#991b1b}.b-ok{background:#dcfce7;color:#166534}.b-med{background:#fef3c7;color:#92400e}.b-low{background:#e0e7ff;color:#3730a3}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
code{background:var(--code);padding:1px 5px;border-radius:4px}
pre{background:var(--code);padding:10px;border-radius:8px;overflow:auto;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel)}
tr.click{cursor:pointer}tr.click:hover{background:var(--panel2)}
.scroll{overflow-x:auto}
.dim{opacity:.18;transition:opacity .15s}
[data-svcs]{transition:opacity .15s}
svg text{font-family:system-ui,sans-serif;fill:var(--text)}
svg .mut{fill:var(--muted)}
.node{cursor:pointer}.node rect{fill:var(--panel);stroke-width:2;transition:filter .15s}
.node:hover rect{filter:brightness(1.07) drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.edge{stroke:var(--muted);stroke-width:2;fill:none;cursor:pointer}.edge:hover{stroke:var(--accent);stroke-width:3}
.edge.dash{stroke-dasharray:6 5}
.step{cursor:pointer}.step.act .hl{opacity:1}.hl{opacity:0;fill:var(--accent)}
.step.act .hl{opacity:.13}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pick button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:13px}
.pick button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.journey{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 18px}
.jstep{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 10px;cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.jstep:hover{border-color:var(--accent)}
.jarrow{color:var(--muted)}
.g-public{border-left:4px solid #22c55e}.g-auth{border-left:4px solid #f59e0b}.g-RENTER{border-left:4px solid #3b82f6}.g-FARMER{border-left:4px solid #84cc16}.g-ADMIN{border-left:4px solid #a855f7}.g-public-only{border-left:4px solid #94a3b8}
.sev{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;text-transform:uppercase}
.sev.critical{background:var(--bad);color:#fff}.sev.high{background:#f97316;color:#fff}.sev.medium{background:#fbbf24;color:#422006}.sev.low{background:#cbd5e1;color:#1e293b}.sev.fixed{background:#16a34a;color:#fff}
details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:6px 0;padding:8px 12px}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:6px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:60;transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dhead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.crumbs{flex:1;display:flex;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--muted)}
.crumbs a{cursor:pointer;text-decoration:underline}
.dbody{padding:14px 16px 40px;overflow:auto;flex:1}
.dbody h3:first-child{margin-top:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tick{color:var(--ok);font-weight:700}.cross{color:var(--muted)}
.callout{border-left:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel));padding:8px 12px;border-radius:6px;margin:8px 0}
.callout.note{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--panel))}
.callout.patch{border-left-color:#8b5cf6;background:color-mix(in srgb,#8b5cf6 8%,var(--panel))}
.er-box{cursor:pointer}.er-box rect{fill:var(--panel);stroke:#14b8a6;stroke-width:2}
.er-box.patch rect{stroke:#8b5cf6;stroke-dasharray:5 4}
.er-line{stroke:var(--muted);stroke-width:1.6;opacity:.55}.er-line.hot{stroke:#14b8a6;stroke-width:3;opacity:1}
ul.t{margin:4px 0 4px 18px;padding:0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px}
.kv b{color:var(--muted);font-weight:600}
@media (max-width:640px){.kv{grid-template-columns:1fr}}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><i></i> Khetly · System Design</div>
    <div class="search"><input id="q" placeholder="Search tables, columns, endpoints, routes, questions…" autocomplete="off"><div class="results" id="results"></div></div>
    <div class="svcs" id="svcs"></div>
    <button class="btn" id="theme" title="Toggle theme">◐</button>
  </div>
  <nav id="nav"></nav>
</header>
<main>
  <section class="tab" id="tab-overview"></section>
  <section class="tab" id="tab-flows"></section>
  <section class="tab" id="tab-journeys"></section>
  <section class="tab" id="tab-db"></section>
  <section class="tab" id="tab-api"></section>
  <section class="tab" id="tab-auth"></section>
  <section class="tab" id="tab-frontend"></section>
  <section class="tab" id="tab-deploy"></section>
  <section class="tab" id="tab-interview"></section>
</main>
<aside class="drawer" id="drawer"><div class="dhead"><div class="crumbs" id="crumbs"></div><button class="btn" id="dclose">✕</button></div><div class="dbody" id="dbody"></div></aside>
<footer>Grounded in github.com/ak8415129/Khetly-v2 @ f486f94 (re-synced after PR #1) · PR #1 (RAG, reviews, disputes) is merged as <code>f486f94</code>. The admin audit-log page is still not in the repo.</footer>
<script>
/* ======================= KHETLY DATA MODEL (grounded in repo HEAD 12eef13) ======================= */
const SVC = {
  web:  { name: 'Frontend',        color: '#3b82f6', desc: 'React SPA served from Vercel' },
  fb:   { name: 'Firebase',        color: '#f59e0b', desc: 'Google sign-in + ID-token verification' },
  auth: { name: 'Auth / JWT',      color: '#a855f7', desc: 'Own access + refresh tokens, RBAC' },
  api:  { name: 'API',             color: '#22c55e', desc: 'Express + zod + Prisma, hosted on Render' },
  db:   { name: 'Database',        color: '#14b8a6', desc: 'PostgreSQL on Supabase via Prisma' },
  ai:   { name: 'AI / LLM',        color: '#ec4899', desc: 'Groq LLM + local embeddings + pgvector RAG' },
  host: { name: 'Hosting',         color: '#64748b', desc: 'Vercel + Render + Supabase (free tiers)' },
};

/* ---------- DATABASE ---------- */
const ENUMS = {
  UserRole: ['RENTER', 'FARMER', 'ADMIN'],
  VerificationStatus: ['PENDING', 'IN_REVIEW', 'VERIFIED', 'REJECTED'],
  RiskLevel: ['LOW', 'MEDIUM', 'HIGH'],
  ListingStatus: ['DRAFT', 'PENDING_REVIEW', 'ACTIVE', 'PAUSED', 'ARCHIVED', 'REJECTED'],
  BookingStatus: ['ENQUIRY', 'CONFIRMED', 'ACTIVE', 'COMPLETED', 'CANCELLED', 'DISPUTED'],
  HarvestSeason: ['RABI', 'KHARIF', 'ZAID', 'YEAR_ROUND'],
  LandType: ['IRRIGATED_CANAL', 'IRRIGATED_BOREWELL', 'RAINFED', 'ORCHARD'],
  SoilType: ['SANDY_LOAM', 'CLAY_LOAM', 'BLACK_COTTON', 'RED_LATERITE', 'ALLUVIAL', 'UNKNOWN'],
  LogisticsOption: ['DOORSTEP_DELIVERY', 'FARM_PICKUP', 'MANDI_DROP', 'COURIER'],
  AddonType: ['FARM_VIDEO', 'FARM_VISIT', 'TREE_RENTAL', 'HOMEMADE_PRODUCTS', 'HARVEST_BOX', 'HARVEST_PHOTOS'],
  PayoutStatus: ['PENDING', 'PROCESSING', 'PAID', 'FAILED'],
};

// col: [name, type, flags, note]
const TABLES = {
  users: {
    model: 'User', purpose: 'Every human on the platform (renter, farmer or admin). Identity is delegated to Firebase; this row is the app-side profile + role.',
    x: 40, y: 40,
    cols: [
      ['id', 'String (uuid)', 'PK', 'Our own id; goes in JWT `sub`.'],
      ['firebaseUid', 'String', 'UNIQUE', 'Link to Firebase Auth user. Lookup key at login.'],
      ['email', 'String', 'UNIQUE', 'From Google; must be email_verified.'],
      ['phone', 'String?', '', 'Optional now (OTP flow was replaced by Google).'],
      ['role', 'UserRole', 'DEFAULT RENTER', 'RENTER | FARMER | ADMIN. Copied into the JWT.'],
      ['name', 'String', 'DEFAULT ""', ''],
      ['avatarUrl', 'String?', '', 'Google profile picture.'],
      ['preferredLanguage', 'String', 'DEFAULT "en"', 'en | hi'],
      ['isVerified', 'Boolean', 'DEFAULT true', 'Google-verified email = trusted.'],
      ['profileCompleted', 'Boolean', 'DEFAULT false', 'Has chosen role + name. Admins skip.'],
      ['isActive', 'Boolean', 'DEFAULT true', 'Suspension switch; checked on EVERY request.'],
      ['createdAt', 'DateTime', 'DEFAULT now()', ''],
      ['updatedAt', 'DateTime', '@updatedAt', ''],
    ],
    indexes: ['PK(id)', 'UNIQUE(firebaseUid)', 'UNIQUE(email)'],
    rel: [['refresh_tokens', '1 → N', 'user has many sessions'], ['farmer_profiles', '1 → 0..1', 'only role FARMER'], ['bookings', '1 → N', 'as renter'], ['reviews', '1 → N', 'as reviewer'], ['admin_actions', '1 → N', 'as admin actor']],
    sample: { id: 'a1b2…', firebaseUid: 'fQx…', email: 'asha@gmail.com', role: 'FARMER', name: 'Asha Patil', isActive: true, profileCompleted: true },
  },
  refresh_tokens: {
    model: 'RefreshToken', purpose: 'Server-side store of valid refresh JWTs. Enables rotation, logout-everywhere and suspension (delete rows = kill sessions).',
    x: 40, y: 330,
    cols: [
      ['id', 'String (uuid)', 'PK', ''],
      ['userId', 'String', 'FK → users.id', 'ON DELETE CASCADE'],
      ['token', 'String', 'UNIQUE', 'The refresh JWT itself (stored in plaintext - see known gaps).'],
      ['expiresAt', 'DateTime', '', 'now + 90 days.'],
      ['createdAt', 'DateTime', 'DEFAULT now()', ''],
    ],
    indexes: ['PK(id)', 'UNIQUE(token)', 'INDEX(token)', 'INDEX(userId)'],
    rel: [['users', 'N → 1', 'cascade delete']],
    sample: { id: 'c9d…', userId: 'a1b2…', token: 'eyJhbGciOi…', expiresAt: '+90d' },
  },
  farmer_profiles: {
    model: 'FarmerProfile', purpose: 'Farmer-specific data: location, KYC flags, bank details, rating. Exactly one per FARMER user.',
    x: 330, y: 40,
    cols: [
      ['id', 'String (uuid)', 'PK', 'Referenced by listings and bookings (NOT users.id).'],
      ['userId', 'String', 'UNIQUE, FK → users.id', 'ON DELETE CASCADE'],
      ['bio', 'String', 'DEFAULT ""', ''],
      ['village / tehsil / district / state / pincode', 'String', 'DEFAULT ""', 'Home address of the farmer.'],
      ['experienceYears', 'Int', 'DEFAULT 0', ''],
      ['aadhaarVerified', 'Boolean', 'DEFAULT false', 'Set true by the farmer’s own PATCH (see gaps) or by admin verify.'],
      ['bankVerified', 'Boolean', 'DEFAULT false', 'Same as above.'],
      ['verificationStatus', 'VerificationStatus', 'DEFAULT PENDING', 'Admin-controlled: PENDING→VERIFIED/REJECTED.'],
      ['bankAccountNumber / ifscCode / accountHolderName / upiId', 'String?', '', 'Payout details (plaintext).'],
      ['rating', 'Float', 'DEFAULT 0', 'Denormalised average.'],
      ['reviewCount', 'Int', 'DEFAULT 0', 'Denormalised.'],
      ['createdAt / updatedAt', 'DateTime', '', ''],
    ],
    indexes: ['PK(id)', 'UNIQUE(userId)'],
    rel: [['users', '1 → 1', 'owner'], ['land_listings', '1 → N', 'farmer’s plots'], ['bookings', '1 → N', 'as farmer']],
    sample: { id: 'f3e…', userId: 'a1b2…', district: 'Nashik', verificationStatus: 'PENDING', rating: 0 },
  },
  land_listings: {
    model: 'LandListing', purpose: 'A rentable plot with crop plan, expected yield, price and a moderation status. Address and crop fields are flat columns; the API re-shapes them into `address{}` / `cropDetails{}` objects.',
    x: 620, y: 40,
    cols: [
      ['id', 'String (uuid)', 'PK', ''],
      ['farmerId', 'String', 'FK → farmer_profiles.id', 'No cascade.'],
      ['title / description', 'String', '', ''],
      ['landType', 'LandType', '', 'IRRIGATED_CANAL | IRRIGATED_BOREWELL | RAINFED | ORCHARD'],
      ['soilType', 'SoilType', 'DEFAULT UNKNOWN', ''],
      ['plotSizeAcres', 'Float', '', ''],
      ['village / tehsil / district / state / pincode', 'String', '', 'Flattened address.'],
      ['lat, lng', 'Float', 'INDEX(lat,lng)', 'Used by haversine distance (computed in app code).'],
      ['primaryCrop / seedVariety', 'String', '', ''],
      ['harvestSeason', 'HarvestSeason', '', 'RABI | KHARIF | ZAID | YEAR_ROUND'],
      ['yieldMin / yieldMax / yieldUnit', 'Float / Float / String', 'unit DEFAULT "quintal/acre"', ''],
      ['priceMin / priceMax / priceUnit', 'Float / Float / String', 'unit DEFAULT "per quintal"', 'Expected market price range.'],
      ['fertilizerPlan / pesticidePlan', 'String', 'DEFAULT ""', ''],
      ['riskLevel / riskDescription', 'RiskLevel / String', 'DEFAULT LOW', ''],
      ['logistics', 'LogisticsOption[]', '', 'Postgres enum array.'],
      ['addons', 'AddonType[]', '', ''],
      ['pricePerMonth', 'Float', '', 'Booking total = pricePerMonth × months.'],
      ['minRentalMonths', 'Int', 'DEFAULT 1', ''],
      ['status', 'ListingStatus', 'DEFAULT DRAFT · INDEX', 'API creates as PENDING_REVIEW. Only ACTIVE is searchable/bookable.'],
      ['rejectionReason', 'String?', '', 'Admin’s reason on reject.'],
      ['photos', 'String[]', '', 'URLs. No upload endpoint in repo yet.'],
      ['videoUrl', 'String?', '', ''],
      ['viewCount / bookingCount', 'Int', 'DEFAULT 0', 'viewCount ++ on GET /listings/:id.'],
      ['createdAt / updatedAt', 'DateTime', '', ''],
    ],
    indexes: ['PK(id)', 'INDEX(lat,lng)', 'INDEX(status)', 'INDEX(farmerId)'],
    rel: [['farmer_profiles', 'N → 1', 'owner'], ['bookings', '1 → N', ''], ['reviews', '1 → N', '']],
    sample: { id: 'l7a…', title: '3 acre canal-fed plot', primaryCrop: 'Tomato', pricePerMonth: 18000, status: 'ACTIVE', district: 'Nashik' },
  },
  bookings: {
    model: 'Booking', purpose: 'A renter’s request/lease on a listing. Money fields are snapshotted at creation so later price edits never change old bookings.',
    x: 620, y: 360,
    cols: [
      ['id', 'String (uuid)', 'PK', ''],
      ['listingId', 'String', 'FK → land_listings.id', 'INDEX'],
      ['renterId', 'String', 'FK → users.id', 'INDEX'],
      ['farmerId', 'String', 'FK → farmer_profiles.id', 'INDEX · copied from listing at creation'],
      ['status', 'BookingStatus', 'DEFAULT ENQUIRY', 'ENQUIRY | CONFIRMED | ACTIVE | COMPLETED | CANCELLED | DISPUTED'],
      ['startDate / endDate', 'DateTime', '', 'endDate = addMonths(start, durationMonths)'],
      ['durationMonths', 'Int', '', '≥ listing.minRentalMonths (only check today).'],
      ['totalAmount', 'Float', '', 'pricePerMonth × durationMonths'],
      ['platformFeePercent', 'Float', 'DEFAULT 8', 'Snapshot of the fee %.'],
      ['platformFee', 'Float', '', 'calcPlatformFee(total)'],
      ['farmerReceives', 'Float', '', 'total − platformFee'],
      ['selectedAddons', 'AddonType[]', '', ''],
      ['notes', 'String?', '', ''],
      ['payoutStatus', 'PayoutStatus', 'DEFAULT PENDING', 'Placeholder - no payment gateway yet.'],
      ['createdAt / updatedAt', 'DateTime', '', ''],
    ],
    indexes: ['PK(id)', 'INDEX(renterId)', 'INDEX(farmerId)', 'INDEX(listingId)'],
    rel: [['land_listings', 'N → 1', ''], ['users', 'N → 1', 'renter'], ['farmer_profiles', 'N → 1', 'farmer'], ['reviews', '1 → 0..1', 'one review per booking']],
    sample: { id: 'b5c…', status: 'ENQUIRY', durationMonths: 3, totalAmount: 54000, platformFee: 4320, farmerReceives: 49680 },
  },
  reviews: {
    model: 'Review', purpose: 'One review per completed booking, with sub-ratings. Schema exists but NO endpoint writes it yet.',
    x: 330, y: 360,
    cols: [
      ['id', 'String (uuid)', 'PK', ''],
      ['bookingId', 'String', 'UNIQUE, FK → bookings.id', ''],
      ['reviewerId', 'String', 'FK → users.id', 'INDEX'],
      ['listingId', 'String', 'FK → land_listings.id', 'INDEX'],
      ['rating', 'Int', '', '1-5'],
      ['comment', 'String', '', ''],
      ['yieldAccuracy / farmerResponsiveness / valueForMoney', 'Int', '', 'Sub-ratings.'],
      ['createdAt', 'DateTime', '', ''],
    ],
    indexes: ['PK(id)', 'UNIQUE(bookingId)', 'INDEX(listingId)', 'INDEX(reviewerId)'],
    rel: [['bookings', '1 → 1', ''], ['users', 'N → 1', 'reviewer'], ['land_listings', 'N → 1', '']],
    sample: { id: 'r2…', bookingId: 'b5c…', rating: 5, comment: 'Yield matched the plan.' },
  },
  admin_actions: {
    model: 'AdminAction', purpose: 'Append-only audit trail. Every admin mutation (suspend, verify, approve, reject, remove) writes one row.',
    x: 40, y: 560,
    cols: [
      ['id', 'String (uuid)', 'PK', ''],
      ['adminId', 'String', 'FK → users.id', 'INDEX'],
      ['action', 'String', '', 'APPROVE_LISTING, REJECT_LISTING, REMOVE_LISTING, SUSPEND_USER, REACTIVATE_USER, VERIFY_FARMER, REJECT_FARMER'],
      ['targetType', 'String', '', '"User" | "LandListing" | "FarmerProfile"'],
      ['targetId', 'String', '', 'INDEX(targetType,targetId)'],
      ['reason', 'String?', '', ''],
      ['createdAt', 'DateTime', 'DEFAULT now()', ''],
    ],

/* ---------- INTERVIEW Q&A ---------- */
const QA = [
  { c: 'Architecture', q: 'Walk me through the architecture of Khetly in 60 seconds.', a: 'A React SPA on Vercel talks JSON/HTTPS to a modular-monolith Express API on Render. Google sign-in is handled by Firebase; the API verifies the Firebase ID token once and issues its own short-lived access JWT + rotating refresh token. Data lives in PostgreSQL (Supabase) behind Prisma. Admins moderate listings and farmers; every admin action is audit-logged. Two Groq-powered AI features give advice: a persona chat for signed-in users and a public RAG widget grounded in a pgvector knowledge base.' },
  { c: 'Architecture', q: 'Why a modular monolith instead of microservices?', a: 'One team, one deploy, one DB, free-tier hosting. Modules (auth, listings, bookings, farmer, admin, ai) each have router/controller/service, so they can be extracted later. Microservices would add network failures, distributed transactions and ops overhead with no scaling benefit at this size.' },
  { c: 'Auth', q: 'Why Firebase for login AND your own JWTs?', a: 'Firebase solves the hard part (Google OAuth, email verification) without managing passwords. But a Firebase token has no Khetly role and would require a Firebase round-trip or SDK call on every request. Exchanging it once for our own JWT gives custom claims (role), our own expiry, offline verification (just HMAC), and lets us revoke via our DB.' },
  { c: 'Auth', q: 'How do refresh-token rotation and logout work?', a: 'Refresh JWT (90d, separate secret) is stored in refresh_tokens. On /token/refresh we verify the signature, require the row to exist and be unexpired, delete it and insert a new one - so a refresh token is single-use. Logout deletes all rows for the user. The access token (7d) cannot be revoked itself, which is why requireAuth also checks the user row.' },
  { c: 'Auth', q: 'A user is suspended - how fast does it take effect with a 7-day JWT?', a: 'Immediately. requireAuth does a DB lookup on every request and returns 403 ACCOUNT_SUSPENDED when isActive is false; suspendUser also deletes refresh tokens. Trade-off: one extra indexed query per request. A stateless alternative is a short access TTL (5-15 min) plus a deny-list.' },
  { c: 'Auth', q: 'Authentication vs authorization here?', a: 'Authentication: requireAuth (valid access JWT + existing active user). Authorization: requireRole/requireAdmin for coarse role checks, then ownership checks inside services (listing.farmerId === profile.id, booking.renterId === userId). Role is read from the DB, not trusted from the token.' },
  { c: 'Auth', q: 'How would you break this auth design?', a: 'The best answer is the real bug: PATCH /users/me spreads req.body into prisma.user.update, so a user can set their own role to ADMIN. Others: tokens in localStorage (XSS), plaintext refresh tokens in DB, default JWT secrets if env is missing. Fixes: strict zod schemas, httpOnly cookies, hashed refresh tokens, fail-fast on missing secrets.' },
  { c: 'Database', q: 'Why PostgreSQL / Prisma?', a: 'Strongly relational data (users→farmers→listings→bookings→reviews), enums, arrays, transactions and indexes; plus pgvector for RAG in the same DB. Prisma gives typed queries and migrations. Cost: ORM overhead and awkward raw SQL for vectors (we use $queryRaw).' },
  { c: 'Database', q: 'Why does DATABASE_URL differ from DIRECT_URL?', a: 'Supabase fronts Postgres with PgBouncer (transaction pooling, port 6543). Prisma Migrate needs session features that PgBouncer breaks, so schema commands use directUrl (5432) while the app uses the pooled URL with ?pgbouncer=true.' },
  { c: 'Database', q: 'Why store platformFee, farmerReceives and platformFeePercent on the booking?', a: 'Snapshot pattern: price or fee-policy changes later must not rewrite history. Money is computed server-side (never trusted from the client) and stored so reports and payouts are reproducible. In production use integer paise/Decimal rather than Float.' },
  { c: 'Database', q: 'How is a listing’s lifecycle modelled?', a: 'ListingStatus enum acts as a state machine: created as PENDING_REVIEW → admin approve ACTIVE / reject REJECTED; editing ACTIVE sends it back to review; delete = ARCHIVED (soft delete). Only ACTIVE is searchable/bookable. Gap: no REJECTED→PENDING resubmit and the status field is client-writable via mass-assignment.' },
  { c: 'API', q: 'What is the response/error contract?', a: 'Success: {success:true,data}. Failure: {success:false,error,code,statusCode,details?}. Prisma P2002 → 409 and P2025 → 404, zod → 422 with details, AppError for domain errors. The Axios interceptor unwraps the envelope so UI code deals with plain data.' },
  { c: 'API', q: 'Explain the middleware order and why.', a: 'helmet → cors → global rate-limit → body parser → logger → router-level [requireAuth → requireRole → validate] → controller → notFound → errorHandler. Cheap rejections (rate limit, auth) come before expensive work; validation before business logic; one error handler formats everything.' },
  { c: 'API', q: 'Where is input validation and where is it missing?', a: 'zod covers env, /auth/*, and /ai/chat. Listings, bookings, farmer and users endpoints rely on TypeScript types, which vanish at runtime - the root of the mass-assignment issues. Fix: one zod schema per endpoint via the existing validate() middleware.' },
  { c: 'Scaling', q: 'How would you scale search?', a: 'Today everything is loaded into memory and filtered with haversine. Step 1: bounding-box WHERE on indexed lat/lng and DB-side pagination. Step 2: PostGIS geography + GiST index (ST_DWithin). Step 3: dedicated search (Typesense/Elastic) with caching for the explore page.' },
  { c: 'Scaling', q: 'What breaks first at 100× traffic?', a: '1) Render free-tier cold starts / single instance; 2) per-request user SELECT in requireAuth (add cache or shorter token + deny-list); 3) in-memory listing search; 4) PgBouncer connection limits; 5) in-memory AI history and rate-limit counters (need Redis once there are multiple instances).' },
  { c: 'Frontend', q: 'How does the 401 refresh queue work?', a: 'Response interceptor: on 401 with !_retry, if a refresh is already in flight, the request waits in a queue; otherwise it starts one refresh call. When it resolves, all queued requests replay with the new token; if it fails, the store logs out. Single-flight prevents a stampede of parallel refreshes, which would break single-use rotation.' },
  { c: 'Frontend', q: 'Why public browsing + AuthModal instead of forced login?', a: 'Product decision: let visitors see value first (listings), authenticate only on intent (book/save). AuthModal stores intent + returnTo so after Google sign-in the user lands exactly where they were. Guards: PublicOnlyRoute (login), ProtectedRoute(allowedRoles).' },
  { c: 'AI', q: 'Explain RAG as built here.', a: 'Embed the question locally with MiniLM (384-d) → pgvector cosine search (ORDER BY embedding <=> $1, ivfflat) → take top-4 chunks, keep those with similarity > 0.3 → put them in the system prompt → Groq llama-3.3-70b answers at temperature 0.3, and the sources are returned to the widget. If pgvector or the table is unavailable it falls back to keyword scoring over the in-code knowledge base. Grounding reduces hallucination and the knowledge base is editable data (seed:kb), not model weights.' },
  { c: 'AI', q: 'pgvector or a dedicated vector DB (Qdrant)?', a: 'pgvector: no new service, transactional with the rest of the data, plenty for thousands of chunks. Qdrant: better filtering, scale and ANN tuning once there are millions of vectors or heavy concurrent queries. Chose pgvector for cost and simplicity; the retrieval function is isolated so it can be swapped.' },
  { c: 'AI', q: 'What are the weak spots of your RAG implementation?', a: 'No evaluation set, only 13 chunks, a similarity threshold picked by hand, a silent catch that hides misconfiguration, in-memory conversation history that never evicts, local embedding model cost (RAM, cold start), and a public endpoint that depends on rate limiting alone. Next steps: eval questions with expected sources, hybrid (keyword + vector) search, persisted history, caching, and logging retrieval hits.' },
  { c: 'Product', q: 'How do reviews and disputes work?', a: 'Only the booking’s renter can review, only on a COMPLETED booking, once (checked in code and by UNIQUE(bookingId)). Ratings are clamped to 1-5 and the farmer’s rating and reviewCount are recomputed from all reviews. A renter can dispute a CONFIRMED/ACTIVE/COMPLETED booking, which sets DISPUTED and records the reason in notes. Gap: there is no resolution flow or transaction around the rating update.' },
  { c: 'Security', q: 'List the security controls in the system.', a: 'Helmet headers, CORS to a single origin, global + AI rate limits, Google-verified emails, short-lived signed JWTs with separate refresh secret and rotation, per-request active-user check, role + ownership checks, soft-delete and audit log for admin actions, env validated at boot. Known holes: mass-assignment, plaintext refresh tokens, localStorage tokens.' },
  { c: 'Product', q: 'What is the business model and where is it in the code?', a: 'Marketplace take-rate: 8% platform fee computed in calcPlatformFee and snapshotted on every booking (platformFee / farmerReceives). Admin dashboard sums platformFee for COMPLETED bookings as platformRevenue. Trust is built via farmer verification + listing moderation.' },
];

const PITCH = 'Khetly is a two-sided marketplace where urban renters lease small plots of farmland from verified farmers and receive the harvest. Technically: React/Vite SPA → Express/Prisma API → PostgreSQL, with Firebase Google login exchanged for our own rotating JWTs, role-based access (renter/farmer/admin), a moderated listing pipeline with an audit log, server-computed 8% commission, and Groq-powered AI: a persona chat and a pgvector RAG assistant widget.';

</script>
<script>
/* ======================= APP ======================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const X = (t, id, label, cls) => `<a class="xref ${cls || ''}" data-x="${t}:${esc(id)}">${esc(label == null ? id : label)}</a>`;
const TABS = [['overview', 'Overview'], ['flows', 'Request Flows'], ['journeys', 'User Journeys'], ['db', 'Database'], ['api', 'API Reference'], ['auth', 'Auth & RBAC'], ['frontend', 'Frontend'], ['deploy', 'Deploy & Config'], ['interview', 'Interview Prep']];
const S = { tab: 'overview', svc: null, flow: 'login', step: 0, timer: null, stack: [], api: { mod: 'all', auth: 'all', q: '', gaps: false }, qa: 'All', route: 'all', env: 'all' };
const ep = id => ENDPOINTS.find(e => e.id === id);
const svcChip = k => `<span class="chip" style="border-color:${SVC[k].color}"><span style="color:${SVC[k].color}">●</span> ${SVC[k].name}</span>`;
const epSvcs = e => { const s = new Set(['api']); if (e.tables && e.tables.length) s.add('db'); if (e.auth !== 'none' && e.auth !== '—') s.add('auth'); (e.svc || []).forEach(x => s.add(x)); return Array.from(s); };
const patchBadge = '<span class="badge b-patch">NOT MERGED</span>';

/* ---------- service highlight ---------- */
function applySvc() {
  $$('[data-svcs]').forEach(el => {
    const on = !S.svc || el.getAttribute('data-svcs').split(' ').indexOf(S.svc) >= 0;
    el.classList.toggle('dim', !on);
  });
  $$('#svcs .svc').forEach(b => b.classList.toggle('on', b.dataset.k === S.svc));
}
function buildSvcBar() {
  $('#svcs').innerHTML = '<span class="lbl">Highlight service:</span>' + Object.keys(SVC).map(k => `<button class="svc" data-k="${k}" style="color:${SVC[k].color}" title="${esc(SVC[k].desc)}"><i style="background:${SVC[k].color}"></i><span style="color:var(--text)">${SVC[k].name}</span></button>`).join('');
  $$('#svcs .svc').forEach(b => b.onclick = () => { S.svc = S.svc === b.dataset.k ? null : b.dataset.k; applySvc(); });
}

/* ---------- tabs ---------- */
function buildNav() {
  $('#nav').innerHTML = TABS.map(t => `<button data-t="${t[0]}">${t[1]}</button>`).join('');
  $$('#nav button').forEach(b => b.onclick = () => goTab(b.dataset.t));
}
function goTab(t) {
  S.tab = t;
  $$('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + t));
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* file:// sandbox */ }
  window.scrollTo(0, 0);
  applySvc();
}

/* ---------- drawer ---------- */
function openD(t, id, keep) {
  if (!keep) S.stack = S.stack.filter(x => !(x.t === t && x.id === id));
  S.stack.push({ t: t, id: id });
  renderDrawer();
}
function renderDrawer() {
  const d = $('#drawer');
  if (!S.stack.length) { d.classList.remove('open'); return; }
  const cur = S.stack[S.stack.length - 1];
  $('#crumbs').innerHTML = S.stack.map((x, i) => i === S.stack.length - 1 ? `<b style="color:var(--text)">${esc(labelOf(x))}</b>` : `<a data-i="${i}">${esc(labelOf(x))}</a>`).join(' › ');
  $$('#crumbs a').forEach(a => a.onclick = () => { S.stack = S.stack.slice(0, +a.dataset.i + 1); renderDrawer(); });
  $('#dbody').innerHTML = DR[cur.t] ? DR[cur.t](cur.id) : 'Unknown';
  $('#dbody').scrollTop = 0;
  d.classList.add('open');
  bindX($('#dbody'));
  applySvc();
}
function labelOf(x) {
  if (x.t === 'node') return NODES[x.id] ? NODES[x.id].title.split(' (')[0] : x.id;
  if (x.t === 'ep') { const e = ep(x.id); return e ? e.m + ' ' + e.p : x.id; }
  if (x.t === 'gap') return 'Gap #' + (+x.id + 1);
  if (x.t === 'qa') return 'Question';
  return x.id;
}
function closeD() { S.stack = []; renderDrawer(); }
function bindX(root) {
  $$('a[data-m]', root).forEach(a => a.onclick = e => { e.stopPropagation(); S.api = { mod: a.dataset.m, auth: 'all', q: '', gaps: false }; renderApi(); closeD(); goTab('api'); });
  $$('[data-x]', root).forEach(a => a.onclick = e => {
    e.stopPropagation();
    if (root.id !== 'dbody') S.stack = [];
    const v = a.getAttribute('data-x'); const i = v.indexOf(':'); const t = v.slice(0, i), id = v.slice(i + 1);
    if (t === 'tab') { closeD(); goTab(id); return; }
    if (t === 'flow') { closeD(); S.flow = id; S.step = 0; renderFlows(); goTab('flows'); return; }
    openD(t, id, true);
  });
}

function typeHtml(t) {
  return esc(t).replace(/\b(UserRole|VerificationStatus|RiskLevel|ListingStatus|BookingStatus|HarvestSeason|LandType|SoilType|LogisticsOption|AddonType|PayoutStatus)\b/g, m => `<a class="xref" data-x="enum:${m}">${m}</a>`);
}
function usedBy(tbl) {
  return ENDPOINTS.filter(e => (e.tables || []).some(t => t[0] === tbl)).map(e => ({ e: e, rw: e.tables.find(t => t[0] === tbl)[1] }));
}
function findEp(str) {
  const m = /^(GET|POST|PATCH|DELETE)\s+(\S+)/.exec(str); if (!m) return null;
  return ENDPOINTS.find(e => e.m === m[1] && !e.missing && e.p === '/v1' + m[2]) || null;
}

const DR = {
  table(id) {
    const t = TABLES[id]; if (!t) return 'Not found';
    const ub = usedBy(id);
    return `<h3>${esc(id)} ${t.patch ? patchBadge : ''}</h3>
<p>${esc(t.purpose)}</p>
<div class="kv"><b>Prisma model</b><span><code>${esc(t.model)}</code></span><b>Indexes</b><span>${t.indexes.map(i => `<code>${esc(i)}</code>`).join(' ')}</span></div>
<h3>Schema (${t.cols.length} rows)</h3>
<div class="scroll"><table><tr><th>Column</th><th>Type</th><th>Constraints</th><th>Notes</th></tr>${t.cols.map(c => `<tr><td><code>${esc(c[0])}</code></td><td>${typeHtml(c[1])}</td><td>${esc(c[2])}</td><td>${esc(c[3])}</td></tr>`).join('')}</table></div>
<h3>Relations</h3>${t.rel.length ? '<ul class="t">' + t.rel.map(r => `<li>${X('table', r[0])} <small>${esc(r[1])}</small> ${esc(r[2])}</li>`).join('') + '</ul>' : '<p>None (standalone).</p>'}
<h3>Endpoints that touch it</h3>${ub.length ? '<ul class="t">' + ub.map(u => `<li><span class="badge m-${u.e.m}">${u.e.m}</span> ${X('ep', u.e.id, u.e.p)} <span class="chip">${u.rw}</span></li>`).join('') + '</ul>' : '<p>No endpoint in repo HEAD.</p>'}
<h3>Sample row</h3><pre>${esc(JSON.stringify(t.sample, null, 2))}</pre>`;
  },
  enum(id) {
    const v = ENUMS[id]; if (!v) return 'Not found';
    const cols = []; Object.keys(TABLES).forEach(k => TABLES[k].cols.forEach(c => { if (c[1].indexOf(id) >= 0) cols.push([k, c[0]]); }));
    return `<h3>enum ${esc(id)}</h3><p>${v.map(x => `<code>${x}</code>`).join(' ')}</p><h3>Used by</h3><ul class="t">${cols.map(c => `<li>${X('table', c[0])}.<code>${esc(c[1])}</code></li>`).join('')}</ul>`;
  },
  node(id) {
    const n = NODES[id]; if (!n) return 'Not found';
    let extra = '';
    if (id === 'db') extra = `<h3>Tables – click to open schema</h3><p>${Object.keys(TABLES).map(k => X('table', k, k, 'chip')).join('')}</p><h3>Enums</h3><p>${Object.keys(ENUMS).map(k => X('enum', k, k, 'chip')).join('')}</p>`;
    if (id === 'api') extra = `<h3>Modules → endpoints</h3><p>${['core', 'auth', 'listings', 'farmer', 'users', 'bookings', 'admin', 'ai'].map(m => `<a class="chip xref" data-m="${m}">${m} (${ENDPOINTS.filter(e => e.mod === m).length})</a>`).join('')}</p>`;
    const drill = n.drill.map(d => d[0] === 'mw' ? X('node', 'mw', d[2], 'chip') : X(d[0], d[1], d[2], 'chip')).join('');
    return `<h3>${esc(n.title)}</h3><p>${svcChip(n.svc)}</p><p>${esc(n.summary)}</p>
<h3>Tech</h3><ul class="t">${n.tech.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
<h3>Responsibilities</h3><ul class="t">${n.resp.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
${extra}
<h3>Key files</h3><ul class="t">${n.files.map(x => `<li><code>${esc(x)}</code></li>`).join('')}</ul>
${n.cfg.length ? `<h3>Config</h3><ul class="t">${n.cfg.map(x => `<li><code>${esc(x)}</code></li>`).join('')}</ul>` : ''}
<h3>Failure modes / gotchas</h3><ul class="t">${n.fail.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
<div class="callout note"><b>Interview angle:</b> ${esc(n.iv)}</div>
<h3>Drill down</h3><p>${drill}</p>`;
  },
  edge(id) {
    const e = EDGES.find(x => x.id === id); if (!e) return 'Not found';
    return `<h3>${esc(e.title)}</h3><p>${esc(e.desc)}</p><p>${e.svc.map(svcChip).join('')}</p>${e.flow ? `<p>${X('flow', e.flow, 'Play the related request flow ▶', 'chip')}</p>` : ''}`;
  },
  ep(id) {
    const e = ep(id); if (!e) return 'Not found';
    return `<h3><span class="badge m-${e.m}">${e.m}</span> <code>${esc(e.p)}</code> ${e.patch ? patchBadge : ''} ${e.missing ? '<span class="badge b-gap">NOT IMPLEMENTED</span>' : ''}</h3>
<p>${esc(e.desc)}</p>
<div class="kv"><b>Module</b><span>${esc(e.mod)}</span><b>Auth</b><span>${esc(e.auth)}</span>
<b>Middleware</b><span>${e.mw.length ? e.mw.map(m => `<code>${esc(m)}</code>`).join(' → ') : '—'}</span>
<b>Source</b><span><code>${esc(e.file || '')}</code></span></div>
${e.req ? `<h3>Request</h3><pre>${esc(e.req)}</pre>` : ''}${e.res ? `<h3>Response</h3><pre>${esc(e.res)}</pre>` : ''}
${e.errs ? `<h3>Errors</h3><p>${e.errs.map(x => `<code>${esc(x)}</code>`).join(' ')}</p>` : ''}
<h3>Tables touched</h3><p>${e.tables.length ? e.tables.map(t => X('table', t[0], t[0] + ' · ' + t[1], 'chip')).join('') : '—'}</p>
<h3>Services involved</h3><p>${epSvcs(e).map(svcChip).join('')}</p>
${e.gap ? `<div class="callout"><b>Known gap:</b> ${esc(e.gap)}</div>` : ''}${e.note ? `<div class="callout note">${esc(e.note)}</div>` : ''}`;
  },
  route(id) {
    const r = ROUTES.find(x => x.p === id); if (!r) return 'Not found';
    return `<h3><code>${esc(r.p)}</code></h3><div class="kv"><b>Component</b><span><code>${esc(r.c)}</code></span><b>Guard</b><span>${esc(r.g)}</span></div>
<h3>API calls</h3><ul class="t">${r.api.length ? r.api.map(a => { const e = findEp(a); return `<li>${e ? X('ep', e.id, a) : esc(a)}</li>`; }).join('') : '<li>none</li>'}</ul>
${r.note ? `<div class="callout note">${esc(r.note)}</div>` : ''}`;
  },
  gap(i) {

    return `<h3>${esc(g.t)}</h3><p><span class="sev ${g.sev}">${g.sev}</span></p><h3>Evidence in code</h3><p>${esc(g.ev)}</p><h3>Fix</h3><p>${esc(g.fix)}</p>${g.ep ? `<p>${X('ep', g.ep, 'Open the endpoint →', 'chip')}</p>` : ''}`;
  },
  qa(i) {
    const q = QA[+i]; return `<h3>${esc(q.q)}</h3><p>${esc(q.a)}</p><p><span class="chip">${esc(q.c)}</span></p>`;
  },
};

/* ---------- OVERVIEW ---------- */
const EDGES = [
  { id: 'e-web-api', title: 'Browser → API: HTTPS JSON on /v1', desc: 'Axios client with baseURL `${VITE_API_URL}/v1`, 30s timeout, Bearer access token, envelope unwrapping and a single-flight 401 refresh queue. CORS allows only FRONTEND_URL.', svc: ['web', 'api'], flow: 'request' },
  { id: 'e-web-fb', title: 'Browser → Firebase: Google popup', desc: 'Firebase JS SDK signInWithPopup with prompt=select_account. Returns a Firebase ID token (JWT, ~1h).', svc: ['web', 'fb'], flow: 'login' },
  { id: 'e-api-fb', title: 'API → Firebase: verifyIdToken', desc: 'firebase-admin verifies the signature/audience/expiry of the ID token using Google’s public keys; requires email_verified. Called once per login.', svc: ['api', 'fb'], flow: 'login' },
  { id: 'e-api-db', title: 'API → PostgreSQL: Prisma', desc: 'All data access via Prisma Client over the pooled Supabase connection (PgBouncer, port 6543). Migrations use DIRECT_URL (5432). Raw SQL only for pgvector in the AI patch.', svc: ['api', 'db'], flow: 'browse' },
  { id: 'e-api-ai', title: 'API → LLM: REST', desc: 'lib/groq.ts: plain fetch() to Groq’s OpenAI-compatible /chat/completions (llama-3.3-70b-versatile). Used by both /ai/chat and the RAG /ai/assistant (with retrieved context). No GROQ_API_KEY → 503 AI_NOT_CONFIGURED.', svc: ['api', 'ai'], flow: 'ai' },
  { id: 'e-vercel', title: 'Vercel serves the SPA', desc: 'Static build output from a CDN; rewrites every path to index.html so client-side routing works on refresh.', svc: ['host', 'web'] },
  { id: 'e-render', title: 'Render runs the API', desc: 'Node web service; build step runs `prisma generate` and `db:deploy` (migrations) before `build`. Health check /health.', svc: ['host', 'api'] },
];
function renderOverview() {
  const nodes = [
    ['browser', 30, 60, 230, 100, 'React SPA', 'Vite · Zustand · React Query'],
    ['vercel', 30, 200, 230, 56, 'Vercel', 'static CDN + SPA rewrite'],
    ['firebase', 30, 310, 230, 90, 'Firebase Auth', 'Google sign-in · ID token'],
    ['render', 340, 480, 330, 56, 'Render', 'Node host · migrations on deploy'],
    ['db', 770, 60, 210, 150, 'PostgreSQL', 'Supabase · Prisma · 8 tables'],
    ['ai', 770, 300, 210, 100, 'LLM', 'Groq · RAG widget · pgvector'],
  ];
  const mods = ['auth', 'listings', 'farmer', 'users', 'bookings', 'admin', 'ai'];
  let svg = `<svg viewBox="-40 0 1050 570" width="100%" role="img" aria-label="Khetly architecture"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>`;
  // edges
  const E = (id, d, lbl, lx, ly, dash) => `<g data-svcs="${EDGES.find(e => e.id === id).svc.join(' ')}" data-x="edge:${id}" class="xe"><path class="edge ${dash ? 'dash' : ''}" d="${d}" marker-end="url(#ar)"/><text x="${lx}" y="${ly}" font-size="11" text-anchor="middle" class="mut">${lbl}</text></g>`;
  svg += E('e-web-api', 'M260 100 L340 100', 'HTTPS /v1', 300, 90);
  svg += E('e-web-fb', 'M30 120 C-14 120 -14 350 30 350', '', 0, 0).replace('</g>', '<text transform="translate(-22 235) rotate(-90)" font-size="11" text-anchor="middle" class="mut">Google popup</text></g>');
  svg += E('e-api-fb', 'M340 355 L260 355', 'verifyIdToken', 300, 345);
  svg += E('e-api-db', 'M670 130 L770 130', 'Prisma', 720, 120);
  svg += E('e-api-ai', 'M670 350 L770 350', 'REST', 720, 340);
  svg += E('e-vercel', 'M145 200 L145 162', 'serves', 175, 185, true);
  svg += E('e-render', 'M505 480 L505 444', 'hosts', 535, 468, true);
  // api group
  svg += `<g class="node" data-x="node:api" data-svcs="api"><rect x="340" y="40" width="330" height="404" rx="14" style="stroke:${SVC.api.color}"/><text x="355" y="64" font-size="15" font-weight="700">Express API</text><text x="355" y="82" font-size="11" class="mut">/v1 · modular monolith · Prisma</text></g>`;
  svg += `<g class="node" data-x="node:mw" data-svcs="api auth"><rect x="358" y="96" width="294" height="62" rx="9" style="stroke:${SVC.auth.color}"/><text x="370" y="117" font-size="12" font-weight="700">Middleware pipeline</text><text x="370" y="135" font-size="10.5" class="mut">helmet → cors → rateLimit → json → requireAuth</text><text x="370" y="149" font-size="10.5" class="mut">→ requireRole → zod validate → errorHandler</text></g>`;
  mods.forEach((m, i) => {
    const x = 358 + (i % 2) * 150, y = 176 + Math.floor(i / 2) * 62;
    const n = ENDPOINTS.filter(e => e.mod === m).length;

  });
  svg += `<text x="358" y="430" font-size="10.5" class="mut">router → controller → service → Prisma</text>`;
  nodes.forEach(n => {
    const c = SVC[NODES[n[0]].svc].color;
    svg += `<g class="node" data-x="node:${n[0]}" data-svcs="${NODES[n[0]].svc}${n[0] === 'db' ? '' : ''}"><rect x="${n[1]}" y="${n[2]}" width="${n[3]}" height="${n[4]}" rx="12" style="stroke:${c}"/><text x="${n[1] + 14}" y="${n[2] + 26}" font-size="14" font-weight="700">${n[5]}</text><text x="${n[1] + 14}" y="${n[2] + 45}" font-size="11" class="mut">${n[6]}</text></g>`;
  });
  // tiny table chips inside db node
  const tn = Object.keys(TABLES);
  tn.forEach((t, i) => {
    const x = 782 + (i % 2) * 98, y = 118 + Math.floor(i / 2) * 22;

  svg += '</svg>';
  const crit = GAPS.filter(g => g.sev === 'critical' || g.sev === 'high').length;
  $('#tab-overview').innerHTML = `
<div class="banner"><b>⚠ ${crit} critical/high issues were found while mapping this code</b> (e.g. any user can PATCH <code>/users/me</code> with <code>role:"ADMIN"</code>). They are marked in the API reference and listed in <a data-x="tab:interview">Interview Prep → Known gaps</a>.</div>
<h2>Architecture at a glance</h2>
<p class="sub">Click any box or arrow for details. Click a service chip in the header to highlight everything that involves it (here, in flows and in the API list). Click <b>Database</b> → a table → its schema.</p>
<div class="card" style="padding:6px">${svg}</div>

function renderFlows() {

  });

    const y = top + i * rowH + 20, a = lx(idx(s.f)), b = lx(idx(s.t));
    const ret = /^(\d{3}|decoded|Firebase ID|content|answer)/.test(s.l);
    let g = `<g class="step ${i === S.step ? 'act' : ''}" data-i="${i}" data-svcs="${s.svc.join(' ')}"><rect class="hl" x="8" y="${y - 24}" width="${W - 16}" height="${rowH - 4}" rx="8"/>`;

function stepFlow(d) {
  const f = FLOWS.find(x => x.id === S.flow); const n = S.step + d;

}
function stopPlay() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

function drawMachine(k) {
  const m = MACHINES[k], BW = 140, BH = 40;
  const col = { ok: '#16a34a', gap: '#f59e0b', bad: '#dc2626' };
  const has = (a, b) => m.edges.some(e => e[0] === b && e[1] === a);
  const clip = (p, q) => { // from p toward q, clipped to box around p
    const dx = q[0] - p[0], dy = q[1] - p[1]; const sx = dx ? (BW / 2) / Math.abs(dx) : 1e9, sy = dy ? (BH / 2) / Math.abs(dy) : 1e9; const s = Math.min(sx, sy);
    return [p[0] + dx * s, p[1] + dy * s];
  };
  let svg = `<svg viewBox="0 0 760 270" width="100%"><defs>${Object.keys(col).map(c => `<marker id="m-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${col[c]}"/></marker>`).join('')}</defs>`;
  const P = {}; m.states.forEach(s => { P[s] = [m.pos[s][0] + BW / 2, m.pos[s][1] + BH / 2]; });
  m.edges.forEach(e => {
    let a = P[e[0]], b = P[e[1]];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    const off = has(e[0], e[1]) ? 12 : 0, nx = -dy / len * off, ny = dx / len * off;
    const a2 = [a[0] + nx, a[1] + ny], b2 = [b[0] + nx, b[1] + ny];
    const s = clip(a2, b2), t = clip(b2, a2);
    svg += `<line x1="${s[0]}" y1="${s[1]}" x2="${t[0]}" y2="${t[1]}" stroke="${col[e[3]]}" stroke-width="2" ${e[3] === 'gap' ? 'stroke-dasharray="6 4"' : ''} marker-end="url(#m-${e[3]})"/>`;
    svg += `<text x="${(s[0] + t[0]) / 2}" y="${(s[1] + t[1]) / 2 - 4 + (off ? Math.sign(ny || 1) * 10 : 0)}" font-size="10" text-anchor="middle" style="fill:${col[e[3]]}">${esc(e[2])}</text>`;
  });
  m.states.forEach(s => { svg += `<g><rect x="${m.pos[s][0]}" y="${m.pos[s][1]}" width="${BW}" height="${BH}" rx="8" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/><text x="${P[s][0]}" y="${P[s][1] + 4}" font-size="12" font-weight="600" text-anchor="middle">${s}</text></g>`; });
  svg += '</svg>';
  $('#machine').innerHTML = `<div class="card" style="padding:6px">${svg}</div><ul class="t">${m.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;
}

<h3>requireAuth – what happens on every protected request</h3>

/* ---------- SEARCH ---------- */
function buildIndex() {
  const ix = [];
  Object.keys(TABLES).forEach(k => { ix.push({ k: 'table', id: k, label: k, hint: 'table', text: k + ' ' + TABLES[k].cols.map(c => c[0]).join(' ') }); });
  ENDPOINTS.forEach(e => ix.push({ k: 'ep', id: e.id, label: e.m + ' ' + e.p, hint: 'endpoint', text: e.p + ' ' + e.desc }));
  Object.keys(NODES).forEach(k => ix.push({ k: 'node', id: k, label: NODES[k].title, hint: 'component', text: NODES[k].title + ' ' + NODES[k].summary }));
  ROUTES.forEach(r => ix.push({ k: 'route', id: r.p, label: r.p, hint: 'route', text: r.p + ' ' + r.c }));
  Object.keys(ENUMS).forEach(k => ix.push({ k: 'enum', id: k, label: k, hint: 'enum', text: k + ' ' + ENUMS[k].join(' ') }));
  GAPS.forEach((g, i) => ix.push({ k: 'gap', id: String(i), label: g.t, hint: 'gap', text: g.t + ' ' + g.ev }));
  QA.forEach((q, i) => ix.push({ k: 'qa', id: String(i), label: q.q, hint: 'question', text: q.q + ' ' + q.a }));
  return ix;
}
function bindSearch() {
  const ix = buildIndex(), box = $('#q'), res = $('#results');
  box.oninput = () => {
    const q = box.value.trim().toLowerCase(); if (q.length < 2) { res.style.display = 'none'; return; }
    const hits = ix.filter(x => x.text.toLowerCase().indexOf(q) >= 0).slice(0, 14);
    res.innerHTML = hits.map((h, i) => `<div data-i="${i}">${esc(h.label)}<small>${h.hint}</small></div>`).join('') || '<div>No results</div>';
    res.style.display = 'block';
    $$('div[data-i]', res).forEach(d => d.onclick = () => { const h = hits[+d.dataset.i]; res.style.display = 'none'; box.value = ''; S.stack = []; openD(h.k, h.id, true); });
  };
  document.addEventListener('click', e => { if (!e.target.closest('.search')) res.style.display = 'none'; });
}

/* ---------- init ---------- */
function init() {
  try { const t = localStorage.getItem('khetly-sd-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { /* ignore */ }
  $('#theme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nx);
    try { localStorage.setItem('khetly-sd-theme', nx); } catch (e) { /* ignore */ }
  };
  $('#dclose').onclick = closeD;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeD();
    if (S.tab === 'flows' && !/INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) {
      if (e.key === 'ArrowRight') { stopPlay(); stepFlow(1); } else if (e.key === 'ArrowLeft') { stopPlay(); stepFlow(-1); }
    }
  });
  buildSvcBar(); buildNav(); bindSearch();
  renderOverview(); renderFlows(); renderJourneys(); renderDb(); renderApi(); renderAuth(); renderFrontend(); renderDeploy(); renderInterview();
  const h = (location.hash || '').replace('#', '');
  goTab(TABS.some(t => t[0] === h) ? h : 'overview');
}
init();
